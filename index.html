<meta name="theme-color" content="#0F6E56">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Faida Kibao">

<style>
:root{--g:#0F6E56;--gl:#E1F5EE;--gd:#085041;--tp:#14211B;--ts:#4F5F57;--b:#C9D3CC;--bs:#9FB0A5;--s1:#F3F5F1;--red:#B42318;--navh:62px}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--tp);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input{font-family:inherit;font-size:16px}
button{cursor:pointer}
#app{max-width:480px;margin:0 auto}
.page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.bar{background:var(--g);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
.bar .a{font-size:13px;color:#D6EBDF}
.bar .t{font-size:22px;font-weight:700;line-height:1.25}
.bar .big{font-size:30px;font-weight:700;line-height:1.15}
.bd{padding:14px;display:flex;flex-direction:column;gap:12px;flex:1}
.m{font-size:13px;color:var(--ts)}
.h{font-size:21px;font-weight:700;line-height:1.3}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid .t{position:relative;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--bs);background:#fff;display:flex;flex-direction:column;gap:8px;min-height:76px;justify-content:space-between;color:var(--tp)}
.grid .t.on{border:2px solid var(--g);background:var(--gl)}
.grid .t .n{font-size:15px;font-weight:700}
.grid .t .p{font-size:15px;font-weight:700;color:var(--g)}
.grid .t .k{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.low{font-size:12px;font-weight:700;color:var(--red)}
.bg{position:absolute;top:-10px;right:-6px;min-width:34px;height:26px;border-radius:13px;background:var(--g);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 8px}
.cart{border-top:1px solid var(--b);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;position:sticky;bottom:calc(var(--navh) + env(safe-area-inset-bottom));background:#fff}
.cart.nonav{bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.nav{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--b);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);margin-top:auto}
.nav button{background:none;border:0;min-height:var(--navh);font-size:12.5px;font-weight:700;color:var(--ts);padding:6px 2px;position:relative}
.nav button.on{color:var(--g)}
.nav button.on:before{content:"";position:absolute;top:0;left:20%;right:20%;height:3px;border-radius:0 0 3px 3px;background:var(--g)}
.go{min-height:54px;border-radius:12px;background:var(--g);color:#fff;border:0;font-size:17px;font-weight:700;padding:0 22px;width:100%}
.go.s{width:auto;min-width:130px}
.o{min-height:48px;border-radius:12px;border:1px solid var(--bs);background:#fff;font-size:15px;font-weight:700;color:var(--tp);padding:6px 8px}
.o.on{border:2px solid var(--g);background:var(--gl);color:var(--gd)}
.o.dash{border-style:dashed;border-width:2px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{background:var(--s1);border-radius:12px;padding:10px 12px}
.gr{background:var(--gl);color:var(--gd);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.warn{background:#FAEEDA;color:#633806;border-radius:12px;padding:10px 12px;font-size:14px}
.err{font-size:14px;color:var(--red);font-weight:700}
.lk{background:none;border:0;color:var(--g);font-size:15px;font-weight:700;padding:8px 0;text-align:left}
.c{border-radius:12px;border:1px solid var(--bs);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;text-align:left;background:#fff;color:var(--tp);width:100%;min-height:60px;gap:8px}
.c.on{border:2px solid var(--g);background:var(--gl)}
.sec{font-size:13px;font-weight:700;color:var(--ts);margin:0 0 6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--b);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:var(--tp)}
.row:last-child{border-bottom:0}
.rt{text-align:right}
.nm{font-size:15px;font-weight:700}
.tg{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;margin-top:3px}
.od{background:#FCEBEB;color:#791F1F}
.ok{background:#FAEEDA;color:#633806}
.nw{background:#F1EFE8;color:#444441}
label.f{display:block;border:1px solid var(--bs);border-radius:12px;padding:8px 12px}
label.f span{display:block;font-size:12.5px;color:var(--ts)}
label.f input{border:0;outline:0;width:100%;font-size:17px;font-weight:700;padding:2px 0;background:transparent}
.okc{width:64px;height:64px;border-radius:32px;background:var(--g);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center}
.x{background:none;border:0;color:var(--ts);font-size:20px;min-width:40px;min-height:40px}
</style>

function dayNum(ms){return Math.floor((ms+108e5)/864e5);}
function dayStr(n){return new Date(n*864e5).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});}

async function verifyCode(code){
 if(!(window.crypto&&crypto.subtle))return {err:'codeNoCrypto'};

 if(p.length!==3||p[0]!=='FK1')return {err:'codeBad'};
 try{

  return {e:o.e};

function debt(cid){var n=0;S.sales.forEach(function(s){if(!s.voided&&s.method==='credit'&&s.cust===cid)n+=s.total;});S.payments.forEach(function(p){if(!p.voided&&p.cust===cid)n-=p.amount;});return n;}
function dueTs(cid){var best=null;S.sales.forEach(function(s){if(!s.voided&&s.method==='credit'&&s.cust===cid&&s.due&&DUEDAYS[s.due]){var d=s.ts+DUEDAYS[s.due]*864e5;if(best===null||d<best)best=d;}});return best;}
function waNum(ph){var d=(ph||'').replace(/\D/g,'');if(!d)return '';var cc=S.country==='KE'?'254':'255';if(d.indexOf('0')===0)d=cc+d.slice(1);return d;}
function readForm(){var f={};document.querySelectorAll('[data-f]').forEach(function(i){f[i.getAttribute('data-f')]=i.value;});U.form=f;}
function fv(k){return esc(U.form[k]||'');}
function numOrNaN(v){v=String(v==null?'':v).replace(/,/g,'').trim();return v===''?NaN:Number(v);}

function todayData(){
 var d={sales:0,count:0,cogs:0,cash:0,mobile:0,credit:0,top:{},exp:0,personal:0,expList:[],payTotal:0,cashPay:0};
 S.sales.forEach(function(s){if(s.voided||!isToday(s.ts))return;d.sales+=s.total;d.count++;
  if(s.method==='cash')d.cash+=s.total;else if(s.method==='credit')d.credit+=s.total;else d.mobile+=s.total;
  s.items.forEach(function(i){d.cogs+=i.qty*(i.cost||0);var k=i.name;d.top[k]=(d.top[k]||0)+i.qty*(i.price-(i.cost||0));});});
 S.expenses.forEach(function(e){if(e.voided||!isToday(e.ts))return;d.expList.push(e);if(e.cat==='personal')d.personal+=e.amount;else d.exp+=e.amount;});
 S.payments.forEach(function(p){if(p.voided||!isToday(p.ts))return;d.payTotal+=p.amount;if(p.method==='cash')d.cashPay+=p.amount;});
 d.gross=d.sales-d.cogs;d.net=d.gross-d.exp;
 var day=S.days[dkey()]||{};d.opening=day.opening||0;d.counted=(day.counted==null?null:day.counted);
 d.expected=d.opening+d.cash+d.cashPay-d.exp-d.personal;
 return d;
}

function vMadeni(){
 var rows=[],total=0,over=0,now=Date.now();
 S.customers.forEach(function(c){var d=debt(c.id);if(d>0){var dt=dueTs(c.id);var od=dt!==null&&dt<now;if(od)over++;total+=d;rows.push({c:c,d:d,dt:dt,od:od});}});
 rows.sort(function(a,b){if(a.od!==b.od)return a.od?-1:1;return b.d-a.d;});
 var h='<div class="bar"><div class="a">'+t('debtsTitle')+'</div><div class="big">'+money(total)+'</div><div class="a">'+t('owingCount')+': '+rows.length+' · '+t('overdueCount')+': '+over+'</div></div><div class="bd">';
 if(!rows.length){h+='<div class="card">'+t('noDebts')+'</div>';}
 else{h+='<div>';rows.forEach(function(r){
  var tag=r.dt===null?'<span class="tg nw">'+t('noDate')+'</span>':(r.od?'<span class="tg od">'+t('overdueDays')+' '+Math.max(1,Math.floor((now-r.dt)/864e5))+'</span>':'<span class="tg ok">'+t('dueOn')+' '+new Date(r.dt).toLocaleDateString(undefined,{day:'numeric',month:'short'})+'</span>');
  h+='<button class="row" data-a="custOpen" data-id="'+r.c.id+'"><div><div class="nm">'+esc(r.c.name)+'</div>'+tag+'</div><div class="nm rt">'+money(r.d)+'</div></button>';});h+='</div>';}
 return h+'</div>';
}

var lastScr=null;
function navSync(){try{if(lastScr===null){history.replaceState({s:U.scr},'');}else if(U.scr!==lastScr){if(TABS.indexOf(U.scr)>=0&&TABS.indexOf(lastScr)>=0)history.replaceState({s:U.scr},'');else history.pushState({s:U.scr},'');}}catch(e){}lastScr=U.scr;}
window.addEventListener('popstate',function(e){var s=e.state&&e.state.s;if(!s)return;U.err='';U.msg='';U.scr=s;lastScr=s;render();});
function render(){
 if(isLocked()&&LOCKSCR.indexOf(U.scr)>=0)U.scr='grid';
 var b4=S.maxSeen;nowEff();if(S.maxSeen-b4>36e5)save();
 var f={setup:vSetup,grid:vGrid,pay:vPay,cust:vCust,done:vDone,add:vAdd,madeni:vMadeni,custDetail:vCustDetail,recv:vRecv,bidhaa:vBidhaa,restock:vRestock,leo:vLeo,exp:vExp,menu:vMenu,paywall:vPaywall}[U.scr]||vGrid;
 var html=f();
 if(TABS.indexOf(U.scr)>=0||U.scr==='custDetail'||U.scr==='paywall'){html+=nav();}
 var cartCls=U.scr==='grid'?'':'';
 document.getElementById('app').innerHTML='<div class="page">'+html+'</div>';
 document.documentElement.lang=S.lang;
 navSync();
}

function doBackup(){
 var name='faida-kibao-nakala-'+new Date().toISOString().slice(0,10)+'.json',text=JSON.stringify(S),blob=new Blob([text],{type:'application/json'});
 S.lastBackup=Date.now();save();
 try{var file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Faida Kibao'}).catch(function(){});render();return;}}catch(e){}
 var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);render();
}

function finish(){
 var items=[],total=0;
 S.products.forEach(function(p){var q=U.cart[p.id]||0;if(q){items.push({pid:p.id,name:p.name,qty:q,price:p.price,cost:p.cost||0});total+=q*p.price;}});
 var sale={id:uid(),ts:Date.now(),items:items,total:total,method:U.method,cust:U.method==='credit'?U.cust:null,due:U.method==='credit'?U.due:null,voided:false};
 S.sales.push(sale);items.forEach(function(i){S.moves.push({id:uid(),pid:i.pid,qty:-i.qty,reason:'sale',ref:sale.id,ts:sale.ts});});
 save();U.last=sale.id;U.cart={};U.scr='done';U.err='';render();
}
